<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" width="512" height="768" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sheet" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef0fb"/>
      <stop offset="1" stop-color="#cdd6f3"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5f8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9b0"/>
      <stop offset="1" stop-color="#f8e6cc"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#9aa6d8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9aa6d8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="opening">
      <path id="openingPath" d="M425 350 C430 240 520 175 630 168 C730 165 800 230 815 330 C822 400 770 440 720 470 C650 520 540 510 470 480 C425 450 420 400 425 350 Z"/>
    </clipPath>
  </defs>

  <!-- ground glow -->
  <ellipse cx="520" cy="1500" rx="200" ry="20" fill="url(#shadow)">
    <animate attributeName="rx" values="200;150;200" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="3.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- floating character -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -26; 0 0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- gentle sway of the whole sheet -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-1.6 600 300; 1.6 600 300; -1.6 600 300" dur="4.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

      <!-- ears (seen through sheet) -->
      <ellipse cx="365" cy="437" rx="34" ry="60" fill="#6f6a78"/>
      <ellipse cx="803" cy="292" rx="30" ry="52" fill="#6f6a78" transform="rotate(-20 803 292)"/>

      <!-- neck (seen through sheet) -->
      <path d="M570 490 C585 600 630 665 685 668 C740 640 760 580 740 500 Z" fill="#f1ddc6"/>

      <!-- trailing tail swirl -->
      <path fill="url(#flap)" stroke="#a8b3dc" stroke-width="4" stroke-linejoin="round" d="M330 1300 C290 1350 295 1410 335 1450 C365 1475 392 1482 402 1476 C380 1440 400 1395 455 1360 C470 1340 440 1310 400 1300 Z">
        <animateTransform attributeName="transform" type="rotate" values="-7 400 1310; 9 400 1310; -7 400 1310" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      </path>

      <!-- main sheet body with flowing hem -->
      <path fill="url(#sheet)" fill-opacity="0.9" stroke="#a8b3dc" stroke-width="4" stroke-linejoin="round">
        <animate attributeName="d" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" values="
M600 100 C720 100 830 200 845 330 C850 430 810 520 800 600 C790 700 800 800 795 900 C790 1050 740 1200 650 1300 C610 1360 570 1375 540 1360 C500 1330 420 1340 360 1300 C300 1240 200 1190 140 1225 C130 1205 180 1160 260 1100 C330 1010 330 900 330 800 C330 700 370 640 350 590 C310 540 290 500 295 450 C285 350 330 200 440 140 C500 105 560 98 600 100 Z;
M600 100 C720 100 830 200 845 330 C850 430 810 520 800 600 C790 700 800 800 795 900 C795 1060 755 1210 680 1310 C640 1370 595 1370 560 1350 C515 1320 440 1345 375 1315 C310 1260 215 1215 150 1245 C132 1230 190 1170 262 1112 C330 1010 330 900 330 800 C330 700 370 640 350 590 C310 540 290 500 295 450 C285 350 330 200 440 140 C500 105 560 98 600 100 Z;
M600 100 C720 100 830 200 845 330 C850 430 810 520 800 600 C790 700 800 800 795 900 C790 1050 740 1200 650 1300 C610 1360 570 1375 540 1360 C500 1330 420 1340 360 1300 C300 1240 200 1190 140 1225 C130 1205 180 1160 260 1100 C330 1010 330 900 330 800 C330 700 370 640 350 590 C310 540 290 500 295 450 C285 350 330 200 440 140 C500 105 560 98 600 100 Z"/>
      </path>

      <!-- soft inner folds -->
      <g fill="none" stroke="#b9c4ec" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round">
        <path d="M700 760 C720 900 700 1050 620 1180"/>
        <path d="M430 1120 C470 1200 520 1260 580 1290"/>
      </g>

      <!-- left arm flap -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 520 650; 4 520 650; 0 520 650" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
        <path fill="url(#flap)" fill-opacity="0.95" stroke="#a8b3dc" stroke-width="4" stroke-linejoin="round" d="M460 650 C520 620 580 650 620 720 C650 760 668 790 650 822 C630 832 608 812 604 792 C590 840 505 900 512 985 C516 1025 495 1052 450 1046 C400 1032 350 1092 300 1102 C330 1050 340 950 350 860 C360 760 400 690 460 650 Z"/>
        <path d="M420 740 C400 840 395 940 385 1010" fill="none" stroke="#c4cdf0" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- right arm flap (waving) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 810 640; -8 810 640; 0 810 640" dur="2.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
        <path fill="url(#flap)" fill-opacity="0.95" stroke="#a8b3dc" stroke-width="4" stroke-linejoin="round" d="M820 570 C860 530 900 545 925 590 C960 650 990 720 985 760 C975 792 940 782 920 792 C942 852 932 922 890 937 C850 937 820 892 800 902 C790 800 780 700 790 620 Z"/>
        <path d="M860 620 C890 700 880 800 860 860" fill="none" stroke="#c4cdf0" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- head / face (clipped by hood opening) -->
      <g clip-path="url(#opening)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 620 420; -2.5 620 420; 0 620 420; 2.5 620 420; 0 620 420" dur="6s" repeatCount="indefinite"/>

          <rect x="380" y="140" width="480" height="420" fill="url(#skin)"/>
          <ellipse cx="640" cy="440" rx="150" ry="70" fill="#fbecd6" fill-opacity="0.7"/>

          <!-- eye patches -->
          <ellipse cx="522" cy="345" rx="84" ry="72" fill="#8a6a4b" transform="rotate(-22 522 345)"/>
          <ellipse cx="708" cy="283" rx="64" ry="62" fill="#8a6a4b" transform="rotate(-15 708 283)"/>

          <!-- left eye -->
          <g transform="translate(524 342)">
            <g>
              <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.06;1 1;1 1" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
              <g transform="translate(-524 -342)">
                <ellipse cx="524" cy="342" rx="54" ry="52" fill="#ffffff"/>
                <g>
                  <animateTransform attributeName="transform" type="translate" values="0 0;-7 3;0 0;8 -4;0 0" dur="6s" repeatCount="indefinite"/>
                  <circle cx="522" cy="344" r="40" fill="#5b3a29"/>
                  <circle cx="522" cy="346" r="27" fill="#1c1210"/>
                  <circle cx="506" cy="326" r="10" fill="#ffffff"/>
                  <circle cx="540" cy="364" r="5" fill="#ffffff" fill-opacity="0.85"/>
                </g>
              </g>
            </g>
          </g>

          <!-- right eye -->
          <g transform="translate(708 282)">
            <g>
              <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.06;1 1;1 1" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
              <g transform="translate(-708 -282)">
                <ellipse cx="708" cy="282" rx="40" ry="44" fill="#ffffff"/>
                <g>
                  <animateTransform attributeName="transform" type="translate" values="0 0;-6 3;0 0;6 -3;0 0" dur="6s" repeatCount="indefinite"/>
                  <circle cx="706" cy="284" r="31" fill="#5b3a29"/>
                  <circle cx="706" cy="286" r="21" fill="#1c1210"/>
                  <circle cx="694" cy="270" r="8" fill="#ffffff"/>
                  <circle cx="720" cy="298" r="4" fill="#ffffff" fill-opacity="0.85"/>
                </g>
              </g>
            </g>
          </g>

          <!-- eyebrows -->
          <path d="M468 258 Q495 228 522 236" fill="none" stroke="#6b4a30" stroke-width="11" stroke-linecap="round"/>
          <path d="M664 200 Q690 180 718 198" fill="none" stroke="#6b4a30" stroke-width="11" stroke-linecap="round"/>

          <!-- nose -->
          <ellipse cx="661" cy="355" rx="37" ry="29" fill="#5a3a34" transform="rotate(-15 661 355)"/>
          <ellipse cx="650" cy="344" rx="12" ry="6" fill="#ffffff" fill-opacity="0.35" transform="rotate(-15 650 344)"/>

          <!-- mouth -->
          <path d="M576 406 Q620 428 706 376 Q702 434 652 452 Q598 448 576 406 Z" fill="#c9505a" stroke="#4a2a2a" stroke-width="4" stroke-linejoin="round"/>
          <ellipse cx="648" cy="436" rx="28" ry="13" fill="#f59a96"/>
          <path d="M576 406 Q620 428 706 376" fill="none" stroke="#4a2a2a" stroke-width="5" stroke-linecap="round"/>

          <!-- whiskers -->
          <g stroke="#8a6a4b" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" fill="none">
            <path d="M480 462 Q505 438 530 428"/>
            <path d="M470 482 Q500 458 524 446"/>
            <path d="M735 352 Q775 342 812 350"/>
            <path d="M735 366 Q775 364 806 376"/>
          </g>
        </g>
      </g>

      <!-- hood rim around the face -->
      <use href="#openingPath" fill="none" stroke="#c7cfee" stroke-width="8" stroke-linejoin="round"/>
      <path d="M470 190 C520 130 600 112 690 135" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- floating sparkles -->
    <g fill="#ffffff" stroke="#b9c4ec" stroke-width="2">
      <circle cx="170" cy="700" r="9">
        <animate attributeName="cy" values="900;520" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" cy="1000" r="7">
        <animate attributeName="cy" values="1150;800" dur="6.5s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="300" r="6">
        <animate attributeName="cy" values="480;180" dur="4.8s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="4.8s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="920" cy="400" r="8">
        <animate attributeName="cy" values="560;260" dur="5.8s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="5.8s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
